# 频道语种(面板中文) → 字幕优先语言代码 + 抽样配额
# layer_b_max：B层每语种封顶条数（30%抽完也不超过它，控制每轮总量）
languages:
  印尼:   {sub_langs: ["id"],        layer_a: 30, layer_b_ratio: 0.3, layer_b_max: 30}
  英文:   {sub_langs: ["en"],        layer_a: 30, layer_b_ratio: 0.3, layer_b_max: 30}
  繁中:   {sub_langs: ["zh-TW","zh"], layer_a: 30, layer_b_ratio: 0.3, layer_b_max: 30}
  西语:   {sub_langs: ["es"],        layer_a: 30, layer_b_ratio: 0.3, layer_b_max: 30}
  土耳其: {sub_langs: ["tr"],        layer_a: 30, layer_b_ratio: 0.3, layer_b_max: 30}
  日语:   {sub_langs: ["ja"],        layer_a: 30, layer_b_ratio: 0.3, layer_b_max: 30}
  葡萄牙: {sub_langs: ["pt"],        layer_a: 30, layer_b_ratio: 0.3, layer_b_max: 30}
  韩语:   {sub_langs: ["ko"],        layer_a: 30, layer_b_ratio: 0.3, layer_b_max: 30}
  德语:   {sub_langs: ["de"],        layer_a: 10, layer_b_ratio: 0.3, layer_b_max: 10}
  泰语:   {sub_langs: ["th"],        layer_a: 10, layer_b_ratio: 0.3, layer_b_max: 10}
